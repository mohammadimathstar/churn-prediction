name: CI/CD

# Trigger the workflow on push or pull request to the main branch
on:
  push: 
    branches: [ "main" ]
  pull_request: 
    branches: [ "main" ]

permissions:
  contents: write
  packages: write


jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    # 1. download codes into github action runner 
    - name: Check out repository
      uses: actions/checkout@v4
    
    # 2. setup python 3.12
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    # 3. Install uv
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    # 4. Install dependecies
    - name: Install dependecies
      run: uv sync

    # 5. Train model
    - name: Train model
      run: uv run python -m src.train

    # 6. Run pytest
    - name: Run test
      run: uv run pytest

    # 7. Lint with Ruff (Assuming you added this!)
    - name: Lint with Ruff
      run: uv run ruff check 
    
      # -------------------------------------------------------------
    # CONTINUOUS DEPLOYMENT (CD) TO GITHUB CONTAINER REGISTRY
    # -------------------------------------------------------------
    
    # 8. Log into GitHub Container Registry
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        # GITHUB_TOKEN is automatically provided by GitHub Actions
        password: ${{ secrets.GITHUB_TOKEN }}

    # 9. Extract metadata (tags, labels) for Docker
    # This automatically generates tags based on the Git commit SHA and branch!
    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=sha,format=short # Creates a tag like: sha-1a2b3c4
          type=raw,value=latest # Also tags as 'latest' for convenience

    # 10. Build and Push the Docker Image
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        # Tags the image as ghcr.io/YOUR_GITHUB_USERNAME/REPO_NAME:latest
        tags: ghcr.io/${{ github.repository }}:latest

    # -------------------------------------------------------------
    # AUTOMATIC README UPDATER
    # -------------------------------------------------------------
    - name: Update README with Accuracy
      run: |
        # 1. Read the accuracy from the file saved by train.py
        ACCURACY=$(cat accuracy.txt)
        echo "Read accuracy: $ACCURACY"
        
        # 2. Use sed to replace the number between the HTML comments in README.md
        sed -i -E "s/(<!-- ACCURACY_START -->).*?(<!-- ACCURACY_END -->)/\1$ACCURACY\2/" README.md
        
        # 3. Show the updated line for debugging in CI logs
        grep "ACCURACY_START" README.md
        
        # 4. Commit and push the change back to GitHub
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add README.md
        # Only commit if there are changes (avoids CI failing if accuracy didn't change)
        git commit -m "docs: update model accuracy in README to $ACCURACY [skip ci]" || echo "No changes to commit"
        git push

# about step 9:
# When the GitHub Action runs, it will build the image and push it to GHCR with two tags:

# ghcr.io/your_username/churn-prediction:sha-a1b2c3d (Immutable, traceable version)
# ghcr.io/your_username/churn-prediction:latest (Points to the most recent build)
# If you go to your GitHub Packages page, you will see a list of versions. If the newest one breaks, you can tell your server to pull sha-a1b2c3d to instantly roll back to the working version!